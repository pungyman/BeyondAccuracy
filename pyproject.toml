[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beyondaccuracy"
version = "0.2.0"
description = "Official implementation of Beyond Accuracy: What Language-Subspace Interventions Capture, Remove, and Improve."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "transformers>=4.40",
    "huggingface_hub>=0.23",
    "accelerate>=0.26",  # required for from_pretrained(device_map=...)
    "scikit-learn>=1.3",
    "langdetect>=1.0.9",
    "truststore>=0.10",  # TLS via system keychain; needed behind corp MITM proxies w/ httpx-based huggingface_hub
    "datasets>=2.19",    # E5 benchmark loaders (MGSM / Global-MMLU / XWinograd) via datasets.load_dataset
    "pandas>=2.0",       # E5 eval harness returns a tidy per-item DataFrame (was notebooks-only)
    "matplotlib>=3.7",
    "tqdm>=4.66",
    "optuna>=3.6",       # E5 lever-2 multi-objective λ/layer search (tuning.optuna_search); lazy-imported
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]
# orchestration notebooks (04_E3, 05_E4, 06_E5) use these for plotting / widgets (pandas is core now)
notebooks = ["matplotlib>=3.7", "ipywidgets>=8.0"]
# only needed to pass a CmaEsSampler into tuning.optuna_search (e.g. the per_layer reparam audit)
cmaes = ["cmaes>=0.10"]

# flat src layout: importable modules live directly under src/
[tool.hatch.build.targets.wheel]
sources = ["src"]
include = ["src/*.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "slow: requires loading the model / real activations (deselect with -m 'not slow')",
]
addopts = "-q"
